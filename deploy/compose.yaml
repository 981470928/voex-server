name: ${COMPOSE_PROJECT_NAME:-voex}
services:
  db:
    image: ${VOEX_MYSQL_IMAGE:?MySQL image required}
    pull_policy: never
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-voex}
      MYSQL_USER: ${MYSQL_USER:-voex}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h127.0.0.1 -uroot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40
    mem_limit: 768m
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=40"]
  api:
    image: ${VOEX_API_IMAGE:?API image required}
    pull_policy: never
    restart: unless-stopped
    environment:
      VOEX_ADDR: 0.0.0.0:8090
      VOEX_VERSION: ${VOEX_VERSION}
      VOEX_STORAGE_ROOT: /home/static
      VOEX_HTTP_READ_TIMEOUT: 30m
      JWT_SECRET_FILE: /secrets/jwt-key
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-voex}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-voex}
      VOEX_UPDATER_URL: http://updater:9090
      VOEX_UPDATER_TOKEN: ${VOEX_UPDATER_TOKEN}
      VOEX_MAINTENANCE_FILE: ${VOEX_DEPLOY_DIR}/state/maintenance
    volumes:
      - ${VOEX_STATIC_ROOT:-/home/static}:/home/static
      - ${VOEX_DEPLOY_DIR}/secrets:/secrets
      - ${VOEX_DEPLOY_DIR}/state:${VOEX_DEPLOY_DIR}/state:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 384m
    depends_on:
      db:
        condition: service_healthy
  web:
    image: ${VOEX_NGINX_IMAGE:?fixed Nginx image required}
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${VOEX_BIND_ADDRESS:-127.0.0.1}:${VOEX_HTTP_PORT:-18080}:80"
    environment:
      VOEX_DEPLOY_DIR: ${VOEX_DEPLOY_DIR}
      NGINX_ENVSUBST_FILTER: VOEX_DEPLOY_DIR
    volumes:
      - ${VOEX_DEPLOY_DIR}/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${VOEX_DEPLOY_DIR}/frontend:/srv/voex:ro
      - ${VOEX_DEPLOY_DIR}/state:${VOEX_DEPLOY_DIR}/state:ro
    mem_limit: 128m
    depends_on: [api, updater]
  updater:
    image: ${VOEX_UPDATER_IMAGE:?updater image required}
    pull_policy: never
    restart: unless-stopped
    environment:
      VOEX_DEPLOY_DIR: ${VOEX_DEPLOY_DIR}
      VOEX_STATIC_ROOT: ${VOEX_STATIC_ROOT:-/home/static}
      VOEX_UPDATER_TOKEN: ${VOEX_UPDATER_TOKEN}
      VOEX_RELEASE_PUBLIC_KEY: ${VOEX_DEPLOY_DIR}/release.pub
      VOEX_UPDATER_ADDR: 0.0.0.0:9090
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${VOEX_DEPLOY_DIR}:${VOEX_DEPLOY_DIR}
      - ${VOEX_STATIC_ROOT:-/home/static}:${VOEX_STATIC_ROOT:-/home/static}:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9090/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
volumes:
  mysql-data:
